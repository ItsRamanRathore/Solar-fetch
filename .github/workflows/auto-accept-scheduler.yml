name: Auto Accept Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-auto-accept:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-accept endpoint
        env:
          AUTO_ACCEPT_URL: https://solarfetch.vercel.app/api/cron/auto-accept
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing in GitHub repository secrets"
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$AUTO_ACCEPT_URL"